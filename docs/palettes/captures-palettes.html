<!doctype html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Captures Palettes</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--sans:"Geist",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace;--hand:"Caveat",cursive;--paper:#f4f1ea;--ink:#3b3530}
html[data-mode=dark]{--pg:#08080a;--pgtext:#e4e4e7;--pgdim:#71717a;--pgline:#222226}
html[data-mode=light]{--pg:#efeeea;--pgtext:#27272a;--pgdim:#71717a;--pgline:#dcdad4}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--pg);color:var(--pgtext);font-family:var(--sans);-webkit-font-smoothing:antialiased;transition:background .3s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--pg) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--pgline)}
.top .wrap{height:56px;display:flex;align-items:center;justify-content:space-between}
.top b{font-family:var(--mono);font-size:12px;letter-spacing:.06em}
.tog{display:flex;border:1px solid var(--pgline);border-radius:999px;padding:3px}
.tog button{font-family:var(--mono);font-size:11px;padding:6px 12px;border-radius:999px;color:var(--pgdim)}
.tog button.on{background:var(--pgtext);color:var(--pg)}
.intro{padding:36px 0 4px;max-width:640px}
.intro h1{font-family:var(--mono);font-weight:500;font-size:28px;letter-spacing:-.03em}
.intro p{margin-top:10px;color:var(--pgdim);line-height:1.6;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:28px 0 80px}
.meta h2{font-size:16px;font-weight:600;display:flex;gap:10px;align-items:baseline}
.meta h2 span{font-family:var(--mono);font-size:11px;color:var(--pgdim);font-weight:400}
.meta p{font-size:13px;color:var(--pgdim);line-height:1.55;margin:4px 0 10px;min-height:40px}
.sw{display:flex;gap:6px;margin-top:10px}
.sw i{width:22px;height:22px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.25)}

/* mini site */
.site{border-radius:14px;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 0 0 1px var(--line),0 20px 40px -20px rgba(0,0,0,.4);transition:background .3s,color .3s}
.s-head{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.s-head .logo{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--hi)}
.s-head nav{display:flex;gap:12px;font-size:11px;color:var(--dim);align-items:center}
.s-head nav .on{color:var(--hi)}
.s-head nav .tt{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:10px}
.s-body{padding:20px 18px 18px}
.s-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.s-body h3{font-family:var(--mono);font-weight:500;font-size:34px;letter-spacing:-.05em;color:var(--hi);line-height:1}
.s-body h3 em{font-style:normal;color:var(--accent)}
.s-sub{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5;max-width:240px}
.stats{display:flex;gap:14px;font-family:var(--mono)}
.stats div{font-size:15px;color:var(--hi)}
.stats small{display:block;font-size:9px;color:var(--dim)}
.tabs{display:flex;gap:4px;margin:16px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.tabs span{font-family:var(--mono);font-size:10px;padding:5px 9px;border-radius:6px;color:var(--dim)}
.tabs span.on{background:var(--chip);color:var(--hi);box-shadow:inset 0 0 0 1px var(--line)}
.mat{position:relative;height:200px;border-radius:10px;overflow:hidden;background:
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/24px 24px,
  radial-gradient(ellipse at 45% 35%,var(--mat1),var(--mat2) 80%);box-shadow:inset 0 0 60px rgba(0,0,0,.3)}
.pr{position:absolute;width:84px;background:var(--paper);padding:5px 5px 18px;border-radius:2px;box-shadow:0 10px 18px -6px rgba(0,0,0,.5)}
.pr.l{width:108px}
.pr i{display:block;aspect-ratio:3/4;background-size:cover;background-position:center}
.pr.l i{aspect-ratio:4/3}
.pr em{position:absolute;left:6px;bottom:2px;font-family:var(--hand);font-style:normal;font-size:12px;color:var(--ink);white-space:nowrap}
.ctl{display:flex;gap:6px;margin-top:10px;align-items:center}
.ctl span{font-family:var(--mono);font-size:9.5px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.ctl .acc{background:var(--accent);color:var(--onaccent);border-color:transparent}
.ctl small{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--accent)}
.foot{font-family:var(--mono);font-size:9px;color:var(--dim);text-align:center;padding:12px;border-top:1px solid var(--line)}

/* palettes: dark default, light override */
.p1{--bg:#09090b;--text:#e4e4e7;--muted:#a1a1aa;--dim:#71717a;--hi:#fafafa;--line:#232327;--chip:#18181b;--accent:#fafafa;--onaccent:#09090b;--mat1:#1d3d33;--mat2:#0e211b;--grid:rgba(255,255,255,.055)}
[data-mode=light] .p1{--bg:#f6f5f1;--text:#27272a;--muted:#52525b;--dim:#71717a;--hi:#09090b;--line:#e4e2dc;--chip:#fff;--accent:#09090b;--onaccent:#fff;--mat1:#c4d9cc;--mat2:#98b5a5;--grid:rgba(0,0,0,.07)}

.p2{--bg:#100c0b;--text:#ece3df;--muted:#b3a39d;--dim:#7d6d67;--hi:#fff5f1;--line:#2a201d;--chip:#1c1513;--accent:#ff4b3a;--onaccent:#fff;--mat1:#2a1a17;--mat2:#120b0a;--grid:rgba(255,90,70,.07)}
[data-mode=light] .p2{--bg:#f7f1ee;--text:#2b1f1c;--muted:#6b5650;--dim:#94807a;--hi:#1a100d;--line:#e8dbd5;--chip:#fff;--accent:#d93a2b;--onaccent:#fff;--mat1:#e9d4cd;--mat2:#d4b5ab;--grid:rgba(120,30,20,.08)}

.p3{--bg:#14110d;--text:#ebe3d6;--muted:#b5a993;--dim:#857a67;--hi:#fbf6ec;--line:#2b251d;--chip:#1e1a14;--accent:#f2a33a;--onaccent:#1a1206;--mat1:#2b3a2c;--mat2:#141c15;--grid:rgba(255,230,190,.06)}
[data-mode=light] .p3{--bg:#f4ede1;--text:#2e2619;--muted:#665a46;--dim:#8f8268;--hi:#1c160c;--line:#e3d8c4;--chip:#fffaf1;--accent:#c97a12;--onaccent:#fff;--mat1:#cfd8c2;--mat2:#a9b89c;--grid:rgba(60,50,20,.08)}

.p4{--bg:#0a0f1a;--text:#dfe7f5;--muted:#98a7c2;--dim:#66738c;--hi:#f4f8ff;--line:#1b2436;--chip:#121a2a;--accent:#7fb2ff;--onaccent:#06101f;--mat1:#13284a;--mat2:#081426;--grid:rgba(160,200,255,.07)}
[data-mode=light] .p4{--bg:#f1f4f8;--text:#1b2638;--muted:#4c5b74;--dim:#76839a;--hi:#0b1526;--line:#dde3ec;--chip:#fff;--accent:#1f5fbf;--onaccent:#fff;--mat1:#c9d8ee;--mat2:#9fb6d8;--grid:rgba(20,50,110,.08)}

.p5{--bg:#0b0d0a;--text:#e2e6dc;--muted:#a5ad9a;--dim:#727a68;--hi:#f7faf2;--line:#21261d;--chip:#151913;--accent:#c8e05a;--onaccent:#141a05;--mat1:#203a2c;--mat2:#0d1d15;--grid:rgba(220,255,180,.06)}
[data-mode=light] .p5{--bg:#f3f4ee;--text:#232920;--muted:#555e4c;--dim:#7c8572;--hi:#0f140b;--line:#dfe2d6;--chip:#fff;--accent:#5d7a12;--onaccent:#fff;--mat1:#c8dac6;--mat2:#9db89c;--grid:rgba(30,60,20,.08)}

.p6{--bg:#120f14;--text:#e9e2ec;--muted:#ad9fb3;--dim:#7c6f82;--hi:#fbf7fd;--line:#28212c;--chip:#1c1720;--accent:#ff8a5c;--onaccent:#1f0b03;--mat1:#2b2236;--mat2:#130f19;--grid:rgba(255,200,230,.06)}
[data-mode=light] .p6{--bg:#f7f2f3;--text:#2a2024;--muted:#66545c;--dim:#8f7d85;--hi:#1a1014;--line:#ebdfe2;--chip:#fff;--accent:#e2582a;--onaccent:#fff;--mat1:#e6d6dc;--mat2:#cdb4bf;--grid:rgba(90,30,50,.08)}

@media (max-width:860px){.grid{grid-template-columns:1fr}}
</style>
</head>
